<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cricket AI Agent</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f5f7fb;

    }


    .app {

      width: 100%;

      max-width: 900px;

      margin:
        40px auto;

      padding:
        20px;

    }


    .header {

      background:
        white;

      padding:
        20px;

      border-radius:
        14px;

      margin-bottom:
        16px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,0.08);

    }


    .header h1 {

      margin:
        0 0 8px 0;

    }


    .status {

      color:
        #555;

      font-size:
        14px;

    }


    .chat {

      background:
        white;

      border-radius:
        14px;

      padding:
        20px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,0.08);

    }


    #messages {

      min-height:
        450px;

      max-height:
        600px;

      overflow-y:
        auto;

      padding:
        10px;

      border:
        1px solid #eee;

      border-radius:
        10px;

      margin-bottom:
        16px;

    }


    .message {

      padding:
        12px 14px;

      margin:
        10px 0;

      border-radius:
        10px;

      white-space:
        pre-wrap;

      line-height:
        1.5;

    }


    .user {

      background:
        #e7f0ff;

      margin-left:
        15%;

    }


    .assistant {

      background:
        #f1f1f1;

      margin-right:
        15%;

    }


    .input-area {

      display:
        flex;

      gap:
        10px;

    }


    #message {

      flex:
        1;

      padding:
        14px;

      border:
        1px solid #ccc;

      border-radius:
        10px;

      font-size:
        16px;

      outline:
        none;

    }


    #send {

      padding:
        14px 22px;

      border:
        none;

      border-radius:
        10px;

      background:
        #111;

      color:
        white;

      cursor:
        pointer;

    }


    #send:disabled {

      opacity:
        0.5;

      cursor:
        not-allowed;

    }

  </style>

</head>


<body>


<div class="app">


  <div class="header">

    <h1>
      🏏 Cricket AI Agent
    </h1>

    <div
      class="status"
      id="status"
    >
      Starting...
    </div>

  </div>


  <div class="chat">

    <div id="messages"></div>


    <div class="input-area">

      <input
        id="message"
        placeholder="Ask about cricket..."
        autocomplete="off"
      >

      <button
        id="send"
      >
        Send
      </button>

    </div>

  </div>


</div>


<script>


let sessionId =
  null;


const status =
  document.getElementById(
    "status"
  );


const messages =
  document.getElementById(
    "messages"
  );


const input =
  document.getElementById(
    "message"
  );


const send =
  document.getElementById(
    "send"
  );


// =====================================================
// MESSAGE
// =====================================================

function addMessage(
  role,
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    `message ${role}`;


  div.textContent =
    text;


  messages.appendChild(
    div
  );


  messages.scrollTop =
    messages.scrollHeight;

}


// =====================================================
// CREATE SESSION
// =====================================================

async function createSession() {

  try {

    const response =
      await fetch(
        "/api/session",
        {
          method:
            "POST"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Session creation failed"
      );

    }


    sessionId =
      data.sessionId;


    status.textContent =
      "Connected";


    addMessage(

      "assistant",

      "Hello! I'm your Cricket AI Agent. Ask me about cricket, live scores, or tell me to remember something."

    );


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      "Connection failed: " +
      error.message;

  }

}


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  if (!sessionId) {

    return;

  }


  addMessage(
    "user",
    text
  );


  input.value =
    "";


  send.disabled =
    true;


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              sessionId,

              message:
                text

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Agent request failed"
      );

    }


    addMessage(

      "assistant",

      data.answer

    );


  } catch (error) {

    console.error(
      error
    );


    addMessage(

      "assistant",

      "Error: " +
      error.message

    );

  } finally {

    send.disabled =
      false;

    input.focus();

  }

}


// =====================================================
// EVENTS
// =====================================================

send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


// =====================================================
// START
// =====================================================

createSession();


</script>


</body>

</html>
